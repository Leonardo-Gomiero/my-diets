[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/patients/:id/diets"
  to = "/.netlify/functions/patient-diets?id=:id"
  status = 200

[[redirects]]
  from = "/api/diets/:id"
  to = "/.netlify/functions/diet?id=:id"
  status = 200

[[redirects]]
  from = "/api/patients/:id/temporary-password"
  to = "/.netlify/functions/patient-password?id=:id"
  status = 200

[[redirects]]
  from = "/api/patients/:id/status"
  to = "/.netlify/functions/patient-status?id=:id"
  status = 200

[[redirects]]
  from = "/api/patients/:id"
  to = "/.netlify/functions/patient-detail?id=:id"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
